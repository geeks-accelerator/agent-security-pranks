name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the Release workflow runs this before it publishes

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm test
      - name: The CLI starts
        run: node bin/security-pranks-audit.mjs --version
